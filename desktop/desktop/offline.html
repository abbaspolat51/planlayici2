<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Planlayıcı</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#EDF2F3;color:#0F242B;font:16px/1.5 "Segoe UI",system-ui,sans-serif}
  .box{max-width:420px;text-align:center;padding:32px;background:#fff;border-radius:22px;box-shadow:0 6px 22px rgba(15,50,60,.08)}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#5B6F75;margin:0 0 20px}
  button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 22px;background:#0E6E7A;color:#fff;cursor:pointer}
  @media (prefers-color-scheme:dark){body{background:#0A1A20;color:#E8F3F4}.box{background:#10252D}p{color:#8FA8AE}button{background:#56D0D6;color:#06161B}}
</style>
</head>
<body>
  <div class="box">
    <h1>İnternet bağlantısı yok</h1>
    <p>Planlayıcı verilerini hesabınla eşitlemek için internete bağlanmalı. Bağlantın gelince tekrar dene.</p>
    <button onclick="location.href='https://abbaspolat51.github.io/planlayici2/'">Tekrar dene</button>
  </div>
</body>
</html>
