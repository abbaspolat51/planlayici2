name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Paketleri kur
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx expo install react react-dom react-native react-native-web @expo/metro-runtime @expo/vector-icons \
            expo-status-bar expo-notifications expo-document-picker expo-file-system expo-intent-launcher \
            react-native-safe-area-context @react-native-async-storage/async-storage -- --legacy-peer-deps

      - name: Android projesini üret
        env:
          CI: '1'
        run: |
          npx expo prebuild --platform android --no-install --clean
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: APK'yı derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Dosyayı hazırla
        run: cp android/app/build/outputs/apk/release/app-release.apk Planlayici.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Planlayici-apk
          path: Planlayici.apk

      - name: Sürümler (Releases) sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum Planlayici.apk \
            --title "Planlayıcı (son sürüm)" \
            --notes "Telefondan bu sayfayı aç, Planlayici.apk dosyasına dokunarak indir ve kur."
