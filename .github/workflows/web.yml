name: Bilgisayar sürümü (web)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Paketleri kur
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx expo install react react-dom react-native react-native-web @expo/metro-runtime @expo/vector-icons \
            expo-status-bar expo-notifications expo-document-picker expo-file-system expo-intent-launcher \
            react-native-safe-area-context @react-native-async-storage/async-storage -- --legacy-peer-deps

      - name: Web sürümünü derle
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: |
          npx expo export --platform web
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
